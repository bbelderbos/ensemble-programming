[project]
name = "ensemble"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.115.8",
    "python-decouple>=3.8",
    "redis>=5.2.1",
    "sqlmodel>=0.0.22",
    "uvicorn>=0.34.0",
    "websockets>=15.0",
]

[dependency-groups]
dev = [
    "fakeredis>=2.38.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-playwright>=0.9.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.16.9",
    "ty>=0.0.84",
]

[tool.pytest.ini_options]
pythonpath = ["."]
timeout = 90
markers = ["e2e: drives the app in a real browser"]

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "assets/*"]

[tool.coverage.report]
fail_under = 95
show_missing = true
exclude_also = ['if __name__ == "__main__":']

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
